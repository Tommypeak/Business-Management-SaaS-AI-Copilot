# Optional local container for the internal AI service. No published inference port.
# Run with: docker compose -f docker-compose.yml -f docker-compose.ai.yml up -d --build --wait
# A containerized API on this network uses AI_SERVICE_URL=http://ai:8000.
services:
  ai:
    build:
      context: .
      dockerfile: infrastructure/docker/ai.Dockerfile
    restart: unless-stopped
    environment:
      AI_ENVIRONMENT: production
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET:?Generate AI_SERVICE_SECRET (at least 32 characters)}
      AI_PROVIDER: ${AI_PROVIDER:-openai-compatible}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-https://api.openai.com/v1}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-20000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1500}
      AI_MAX_CONTEXT_CHARACTERS: ${AI_MAX_CONTEXT_CHARACTERS:-48000}
      AI_MAX_TOOL_CALLS: ${AI_MAX_TOOL_CALLS:-6}
    expose:
      - '8000'
