packages:
  - apps/*
  - packages/*

# Runtime workspace packages must be portable in pnpm deploy output.
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

ignoredBuiltDependencies:
  - '@scarf/scarf'

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/engines'
  - '@tailwindcss/oxide'
  - prisma
  - sharp
  - unrs-resolver
